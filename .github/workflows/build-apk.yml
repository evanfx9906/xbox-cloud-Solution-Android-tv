name: Build Xbox Lab APK

on:
  push:
    branches: [ lab ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset edited files to the clean base, then apply fixes
        run: |
          # tools/apply_fixes.py --reset restores the files it edits to the clean base
          # commit and re-applies every edit, so each build starts from the same state.
          python3 tools/apply_fixes.py --reset
          # LAB ONLY: make this a separate app (package ".lab", name "Xbox Lab") so it never touches the working app
          sed -i 's/applicationIdSuffix = ".fixed"/applicationIdSuffix = ".lab"/' app/build.gradle.kts
          sed -i 's#<string name="app_name">cloudxSolution Fixed</string>#<string name="app_name">Xbox Lab</string>#' app/src/main/res/values/strings.xml
          grep -q 'applicationIdSuffix = ".lab"' app/build.gradle.kts
          grep -q '>Xbox Lab<' app/src/main/res/values/strings.xml
          git add app
          if ! git diff --cached --quiet -- app; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Apply fixes via tools/apply_fixes.py"
            git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudx-lab-apk
          path: app/build/outputs/apk/debug/*.apk
