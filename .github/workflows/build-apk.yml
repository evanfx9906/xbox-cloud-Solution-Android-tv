name: Build CloudX Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild the edited files from a clean base, then apply fixes
        run: |
          # The 7 files below are generated: clean base (72dc66f = your fork on Oct 3,
          # before any script ran) + the edits in tools/apply_fixes.py. This makes every
          # build start from the same known state, so results never stack up.
          git checkout 72dc66f -- \
            app/src/main/AndroidManifest.xml \
            app/src/main/java/com/world/cloudxsolution/MainActivity.java \
            app/src/main/res/layout/dialog_app_settings.xml \
            app/src/main/res/layout/dialog_streaming_menu.xml \
            app/src/main/res/layout/dialog_intro_help.xml \
            app/build.gradle.kts \
            app/src/main/res/values/strings.xml
          python3 tools/apply_fixes.py
          git add app
          if ! git diff --cached --quiet -- app; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Apply fixes via tools/apply_fixes.py"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
