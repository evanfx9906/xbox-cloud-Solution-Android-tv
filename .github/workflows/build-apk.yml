name: Build CloudX Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reset edited files to the clean base, then apply fixes
        run: |
          # tools/apply_fixes.py --reset restores the files it edits to the clean base
          # commit and re-applies every edit, so each build starts from the same state.
          python3 tools/apply_fixes.py --reset
          git add app
          if ! git diff --cached --quiet -- app; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git commit -m "Apply fixes via tools/apply_fixes.py"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudx-debug-apk
          path: app/build/outputs/apk/debug/*.apk
